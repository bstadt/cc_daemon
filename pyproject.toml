[project]
name = "claudeconnect"
version = "0.1.0"
description = "Connect contextualized Claude instances"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
]

[project.scripts]
claudeconnect = "claudeconnect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudeconnect"]

[tool.hatch.build.targets.wheel.force-include]
"src/claudeconnect/skills/SKILL.md" = "claudeconnect/skills/SKILL.md"
